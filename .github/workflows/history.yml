name: Historique et entraînement

# Night runs, when no race is run: completes the history (days already
# complete are skipped, so this is quick once the year is collected), then
# recomputes the backtest of every source and the logit model, and finally
# republishes the site with the new reliability figures.
on:
  schedule:
    - cron: "0 0 * * *"   # 01:00 or 02:00 Paris
    - cron: "0 2 * * *"   # 03:00 or 04:00 Paris
  workflow_dispatch:

permissions: {}

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  # GitHub sometimes starts the night schedules hours late (06:24 UTC on
  # 2026-10-17). Started after 08:00 UTC, the 1 h 40 of work would hold the
  # "data" lock through the morning races and delay their results.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    env:
      EVENT: ${{ github.event_name }}
    steps:
      - id: check
        run: |
          if [ "$EVENT" = schedule ] && [ "$(date -u +%-H)" -ge 8 ]; then
            echo "::warning::Lancement planifié trop tardif, historique reporté à la nuit suivante."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  history:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # release assets holding the database
      actions: write    # republish the site afterwards
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restaurer la base
        run: scripts/data_store.sh restore
      - name: Compléter l'historique
        continue-on-error: true
        run: python -m scripts.backfill --days 365 --budget-minutes 100
      - name: Entraîner et tester toutes les sources
        run: python -m predict.train
      - name: Sauvegarder la base
        run: scripts/data_store.sh save
      - name: Republier le site
        env:
          REF_NAME: ${{ github.ref_name }}
        run: gh workflow run collect.yml --ref "$REF_NAME"
