name: Collecte et publication

on:
  schedule:
    # Times in UTC (Paris = UTC+2 in summer, UTC+1 in winter).
    - cron: "0 5 * * *"        # morning: programme, morning odds, first forecasts
    - cron: "*/20 9-22 * * *"  # racing hours: results within 20 minutes, last odds before each start
  workflow_dispatch:

# Least privilege: nothing by default, each job asks for what it needs.
permissions: {}

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # release assets holding the database
      pages: read       # configure-pages
    outputs:
      collect_failed: ${{ steps.collect.outcome == 'failure' }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restaurer la base
        run: scripts/data_store.sh restore
      - name: Collecter
        id: collect
        continue-on-error: true
        run: python -m collect.pipeline
      - name: Pronostics du jour
        run: python -m predict.forecast
      - name: Sauvegarder la base
        run: scripts/data_store.sh save
      - id: pages
        uses: actions/configure-pages@v5
      - name: Générer le site
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python -m site_builder.builder --output output
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The site is still published with the data we have; this job only makes
  # the run fail so that GitHub sends its failure e-mail. With a run every
  # 20 minutes, an outage is only reported by the morning run, the runs of
  # 12:xx and 18:xx UTC and manual runs: at most three e-mails a day.
  alert:
    needs: [build, deploy]
    if: always() && needs.build.outputs.collect_failed == 'true'
    runs-on: ubuntu-latest
    env:
      EVENT: ${{ github.event_name }}
      SCHEDULE: ${{ github.event.schedule }}
    steps:
      - run: |
          hour=$(date -u +%H); minute=$(date -u +%M)
          if [ "$EVENT" = schedule ] && [ "$SCHEDULE" != "0 5 * * *" ] \
             && ! { { [ "$hour" = 12 ] || [ "$hour" = 18 ]; } && [ "$minute" -lt 20 ]; }; then
            echo "::warning::Collecte en échec, alerte e-mail réservée aux runs de 7 h, 14 h et 20 h."
            exit 0
          fi
          echo "::error::La collecte PMU a échoué (API indisponible ?). Voir le journal de l'étape « Collecter »."
          exit 1
