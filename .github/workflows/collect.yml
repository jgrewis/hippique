name: Collecte et publication

on:
  schedule:
    # Times in UTC (Paris = UTC+2 in summer, UTC+1 in winter).
    # Off the hour, when GitHub drops fewer scheduled runs.
    - cron: "5 5 * * *"           # morning: programme, morning odds, first forecasts
    # Racing hours: results within 20 minutes, last odds before each start.
    # GitHub still skips many of these: each run also dispatches the next one
    # (job relay), so the cron only has to start or restart the chain.
    - cron: "7-59/20 9-22 * * *"
  workflow_dispatch:
    inputs:
      relay:
        description: "Lancée par le relais de la plage des courses"
        type: boolean
        default: false

# Least privilege: nothing by default, each job asks for what it needs.
permissions: {}

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # release assets holding the database
      pages: read       # configure-pages
    outputs:
      collect_failed: ${{ steps.collect.outcome == 'failure' }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restaurer la base
        run: scripts/data_store.sh restore
      - name: Collecter
        id: collect
        continue-on-error: true
        run: python -m collect.pipeline
      - name: Pronostics du jour
        run: python -m predict.forecast
      - name: Sauvegarder la base
        run: scripts/data_store.sh save
      - id: pages
        uses: actions/configure-pages@v5
      - name: Générer le site
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python -m site_builder.builder --output output
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Waits for the next 20-minute slot of the racing window, then dispatches
  # the next collection (see scripts/relay.sh). Runs even when the collection
  # failed, so that an outage of the PMU API does not stop the chain.
  relay:
    needs: [build, deploy]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: write    # dispatch the next collection
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REF_NAME: ${{ github.ref_name }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - run: scripts/relay.sh

  # The site is still published with the data we have; this job only makes
  # the run fail so that GitHub sends its failure e-mail. With a run every
  # 20 minutes, an outage is only reported by the morning run, the runs of
  # 12:xx and 18:xx UTC and manual runs: at most three e-mails a day.
  alert:
    needs: [build, deploy]
    if: always() && needs.build.outputs.collect_failed == 'true'
    runs-on: ubuntu-latest
    env:
      EVENT: ${{ github.event_name }}
      SCHEDULE: ${{ github.event.schedule }}
      RELAY: ${{ inputs.relay }}
    steps:
      - run: |
          hour=$(date -u +%H); minute=$(date -u +%M)
          if { { [ "$EVENT" = schedule ] && [ "$SCHEDULE" != "5 5 * * *" ]; } || [ "$RELAY" = true ]; } \
             && ! { { [ "$hour" = 12 ] || [ "$hour" = 18 ]; } && [ "$minute" -lt 20 ]; }; then
            echo "::warning::Collecte en échec, alerte e-mail réservée aux runs de 7 h, 14 h et 20 h."
            exit 0
          fi
          echo "::error::La collecte PMU a échoué (API indisponible ?). Voir le journal de l'étape « Collecter »."
          exit 1
